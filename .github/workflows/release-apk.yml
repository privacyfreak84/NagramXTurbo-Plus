name: Release APK from run
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag:
        required: true
      sha:
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n Staging -D out
          find out -type f
          cat > notes.md <<'NOTES'
          - New opt-in setting (Turbo settings > Forwarding): incoming messages that stay on screen for a chosen time (1-60 s, default 5) are forwarded once to Saved Messages.
          - Scope: all channels by default, or only chats you pick, or all chats. A separate "never save from these chats" list always wins.
          - Always skipped: your own messages, protected chats, secret chats, view-once media, service/sponsored messages, Saved Messages itself. Albums stay together; nothing is saved twice.
          - Signed with the fork's stable key (certificate SHA-256 A5:17:D9:FB:...:D0:5B:CA:7E), so this installs over the previous release without uninstalling.

          Built by CI from commit 2bf287d. CI proves it compiles and packages; the feature itself was not tested on a device.
          NOTES
          APKS=$(find out -name '*.apk')
          gh release create "$TAG" $APKS -R "$GITHUB_REPOSITORY" --target "$SHA" --title "NagramXTurbo-Plus $TAG" --notes-file notes.md
