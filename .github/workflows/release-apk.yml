name: Release APK from run
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag:
        required: true
      sha:
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n Staging -D out
          find out -type f
          cat > notes.md <<'NOTES'
          De-Googled build of NagramXTurbo-Plus (second pass).

          Removed: Firebase/Crashlytics, Google Maps and fused location (OSMDroid + Android location), Firebase push (UnifiedPush is the default; no distributor means no push), Cast/Wear, Vision/ML Kit, reCAPTCHA (fails closed), Google/Gemini translation presets, Google Static Maps URLs (non-Telegram map previews now use the OSM static map service).

          Built by CI from commit 0cf189071 with no Google services config. Compiles and packages; features not tested by CI. Still present by design: Google's Maven repo is used to build, Play Store links in WebView-update dialogs, YouTube embeds.
          NOTES
          APKS=$(find out -name '*.apk')
          gh release create "$TAG" $APKS -R "$GITHUB_REPOSITORY" --target "$SHA" --title "De-Googled build $TAG" --notes-file notes.md
