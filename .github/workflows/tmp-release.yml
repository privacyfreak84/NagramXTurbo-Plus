name: Temp release and cleanup
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag:
        required: true
      sha:
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n Staging -D out
          find out -type f
          cat > notes.md <<'NOTES'
          - Synced with the latest upstream Nagram X Turbo dev: master toggle to disable complex animations, message context menu no longer cut off with 3-button navigation, pinned menu action row, wrapping join-request buttons, hidden-chats entry in the chat list menu when the tab bar is hidden, settings/calls tab fixes, rich editor copy mode in the share sheet, rich forward parity, and a forward-copy caption fix.
          - Still Google-free, and includes all earlier fork changes (lingering auto-save to Saved Messages, copy popup fix, quick-reaction forward).
          - Signed with the fork's stable key, so it installs over the previous release.

          Built by CI from commit 92cdbaa. CI proves it compiles and packages; the merge was not tested on a device.
          NOTES
          APKS=$(find out -name '*.apk')
          gh release create "$TAG" $APKS -R "$GITHUB_REPOSITORY" --target "$SHA" --title "NagramXTurbo-Plus $TAG" --notes-file notes.md
