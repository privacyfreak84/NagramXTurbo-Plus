name: Temp release and cleanup
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      tag:
        required: true
      sha:
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n Staging -D out
          find out -type f
          cat > notes.md <<'NOTES'
          - Synced with upstream Nagram X Turbo 13.2.2 (13.2.1 and 13.2.2 changes: password-protected hidden chats, VP8/VP9 video playback, upload/conversion progress, attach-panel and profile fixes, and more). This also clears the failing weekly upstream sync.
          - Still Google-free: upstream's new Firebase phone-number auto-login and Chromecast code are left out; login falls back to passkey/SMS as before.
          - Includes all earlier fork changes (lingering auto-save to Saved Messages with channel scope, copy popup fix, quick-reaction forward).
          - Signed with the fork's stable key (certificate SHA-256 A5:17:D9:FB:...:D0:5B:CA:7E), so this installs over the previous release without uninstalling.

          Built by CI from commit 9f7dd25. CI proves it compiles and packages; the merge was not tested on a device.
          NOTES
          APKS=$(find out -name '*.apk')
          gh release create "$TAG" $APKS -R "$GITHUB_REPOSITORY" --target "$SHA" --title "NagramXTurbo-Plus $TAG" --notes-file notes.md
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/sync/upstream-20261113" && echo deleted
