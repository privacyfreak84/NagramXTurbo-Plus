name: Temp delete merged branches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in feature/reaction-forward-saved privacy/degoogle-20261026; do
            git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "refs/heads/$b" >/dev/null || { echo "$b already gone"; continue; }
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" && echo "deleted $b"
          done
