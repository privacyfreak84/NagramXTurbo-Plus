name: Temp delete merged branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/feature/dwell-forward-saved" && echo deleted
